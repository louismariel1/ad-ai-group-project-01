name: AML

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0
      - lightning
      - numpy
      - pandas
      - matplotlib
      - scikit-learn
      - Pillow
